version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mandi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - mandi-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity API
  identity-api:
    build:
      context: ./Backend/Services/Identity.API
      dockerfile: Dockerfile
    container_name: mandi-identity-api
    restart: unless-stopped
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=MandiIdentityDB;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - JWT__Secret=${JWT_SECRET}
      - JWT__Issuer=${JWT_ISSUER:-https://vyaparmandap.com}
      - JWT__Audience=${JWT_AUDIENCE:-https://vyaparmandap.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mandi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Marketplace API
  marketplace-api:
    build:
      context: ./Backend/Services/Marketplace.API
      dockerfile: Dockerfile
    container_name: mandi-marketplace-api
    restart: unless-stopped
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=MandiMarketplaceDB;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - JWT__Secret=${JWT_SECRET}
      - JWT__Issuer=${JWT_ISSUER:-https://vyaparmandap.com}
      - JWT__Audience=${JWT_AUDIENCE:-https://vyaparmandap.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mandi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Ordering API
  ordering-api:
    build:
      context: ./Backend/Services/Ordering.API
      dockerfile: Dockerfile
    container_name: mandi-ordering-api
    restart: unless-stopped
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=MandiOrderingDB;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - JWT__Secret=${JWT_SECRET}
      - JWT__Issuer=${JWT_ISSUER:-https://vyaparmandap.com}
      - JWT__Audience=${JWT_AUDIENCE:-https://vyaparmandap.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mandi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Logistics Hub (SignalR for real-time)
  logistics-hub:
    build:
      context: ./Backend/Services/Logistics.Hub
      dockerfile: Dockerfile
    container_name: mandi-logistics-hub
    restart: unless-stopped
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=MandiLogisticsDB;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      - JWT__Secret=${JWT_SECRET}
      - JWT__Issuer=${JWT_ISSUER:-https://vyaparmandap.com}
      - JWT__Audience=${JWT_AUDIENCE:-https://vyaparmandap.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mandi-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: mandi-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./Frontend/www:/usr/share/nginx/html:ro
    depends_on:
      - identity-api
      - marketplace-api
      - ordering-api
      - logistics-hub
    networks:
      - mandi-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres-data:

networks:
  mandi-network:
    driver: bridge
