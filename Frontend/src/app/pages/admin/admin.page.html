<ion-split-pane contentId="admin-content">
  <!-- Side Menu -->
  <ion-menu contentId="admin-content" type="overlay">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Admin Panel</ion-title>
      </ion-toolbar>
    </ion-header>
    
    <ion-content>
      <ion-list>
        <ion-list-header>
          <ion-label>Management</ion-label>
        </ion-list-header>
        
        <ion-menu-toggle auto-hide="false">
          <ion-item button routerLink="/admin/verification" routerLinkActive="active-menu-item">
            <ion-icon slot="start" name="shield-checkmark"></ion-icon>
            <ion-label>KYC Verification</ion-label>
          </ion-item>
          
          <ion-item button routerLink="/admin/users" routerLinkActive="active-menu-item">
            <ion-icon slot="start" name="people"></ion-icon>
            <ion-label>Users</ion-label>
          </ion-item>
          
          <ion-item button routerLink="/admin/hubs" routerLinkActive="active-menu-item">
            <ion-icon slot="start" name="business"></ion-icon>
            <ion-label>Mandis & Hubs</ion-label>
          </ion-item>
          
          <ion-item button routerLink="/admin/marketplace" routerLinkActive="active-menu-item">
            <ion-icon slot="start" name="storefront"></ion-icon>
            <ion-label>Marketplace</ion-label>
          </ion-item>
          
          <ion-item button routerLink="/admin/products" routerLinkActive="active-menu-item">
            <ion-icon slot="start" name="cube"></ion-icon>
            <ion-label>Products</ion-label>
          </ion-item>
          
          <ion-item button routerLink="/admin/logistics" routerLinkActive="active-menu-item">
            <ion-icon slot="start" name="car"></ion-icon>
            <ion-label>Logistics</ion-label>
          </ion-item>
          
          <ion-item button routerLink="/admin/reports" routerLinkActive="active-menu-item">
            <ion-icon slot="start" name="bar-chart"></ion-icon>
            <ion-label>Reports</ion-label>
          </ion-item>
        </ion-menu-toggle>
        
        <ion-list-header style="margin-top: 20px;">
          <ion-label>Quick Actions</ion-label>
        </ion-list-header>
        
        <ion-menu-toggle auto-hide="false">
          <ion-item button (click)="refreshData()">
            <ion-icon slot="start" name="refresh"></ion-icon>
            <ion-label>Refresh Data</ion-label>
          </ion-item>
          
          <ion-item button (click)="viewReports()">
            <ion-icon slot="start" name="bar-chart"></ion-icon>
            <ion-label>Reports</ion-label>
          </ion-item>
        </ion-menu-toggle>
        
        <ion-list-header style="margin-top: 20px;">
          <ion-label>Settings</ion-label>
        </ion-list-header>
        
        <ion-item lines="none">
          <ion-icon slot="start" [name]="darkMode ? 'moon' : 'sunny'"></ion-icon>
          <ion-label>Dark Mode (24/7 Ops)</ion-label>
          <ion-toggle slot="end" [(ngModel)]="darkMode" (ionChange)="toggleDarkMode()"></ion-toggle>
        </ion-item>
      </ion-list>
    </ion-content>
    
    <ion-footer>
      <ion-toolbar>
        <ion-item lines="none">
          <ion-icon slot="start" name="person-circle"></ion-icon>
          <ion-label>
            <h3>Admin User</h3>
            <p>Logged in</p>
          </ion-label>
        </ion-item>
        <ion-menu-toggle auto-hide="false">
          <ion-item button (click)="logout()" lines="none" color="danger">
            <ion-icon slot="start" name="log-out"></ion-icon>
            <ion-label>Logout</ion-label>
          </ion-item>
        </ion-menu-toggle>
      </ion-toolbar>
    </ion-footer>
  </ion-menu>

  <!-- Main Content -->
  <div class="ion-page" id="admin-content">
    <ion-router-outlet></ion-router-outlet>
  </div>
</ion-split-pane>
