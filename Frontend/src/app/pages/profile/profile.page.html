<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Profile</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="profile-container" *ngIf="user">
    <div class="profile-header">
      <ion-avatar>
        <ion-icon name="person-circle-outline"></ion-icon>
      </ion-avatar>
      <h2>{{ user.fullName }}</h2>
      <p>{{ user.phoneNumber }}</p>
      <ion-badge color="primary">{{ user.role }}</ion-badge>
    </div>

    <ion-list>
      <ion-item>
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-label>
          <p>Email</p>
          <h3>{{ user.email || 'Not provided' }}</h3>
        </ion-label>
      </ion-item>

      <ion-item *ngIf="user.role == 'Buyer'">
        <ion-icon name="business-outline" slot="start"></ion-icon>
        <ion-label>
          <p>Company</p>
          <h3>{{ user.companyName || 'Not provided' }}</h3>
        </ion-label>
      </ion-item>

      <ion-item button [routerLink]="['/orders']">
        <ion-icon name="receipt-outline" slot="start"></ion-icon>
        <ion-label>My Orders</ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item button>
        <ion-icon name="settings-outline" slot="start"></ion-icon>
        <ion-label>Settings</ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item button>
        <ion-icon name="help-circle-outline" slot="start"></ion-icon>
        <ion-label>Help & Support</ion-label>
        <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
      </ion-item>

      <ion-item button (click)="logout()" color="danger">
        <ion-icon name="log-out-outline" slot="start"></ion-icon>
        <ion-label>Logout</ion-label>
      </ion-item>
    </ion-list>
  </div>
</ion-content>
