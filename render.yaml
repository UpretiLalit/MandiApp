services:
  # Identity API
  - type: web
    name: mandiapp-identity-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: Backend
    dockerfilePath: Dockerfile.identity
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        value: Host=db.iytscokxxuxprrivmzvg.supabase.co;Port=5432;Database=postgres;User Id=postgres;Password=PYvWmYoMYiO3RiCJ;Ssl Mode=Require;Trust Server Certificate=true
      - key: JwtSettings__SecretKey
        value: YourSuperSecretKeyForJWTAuthentication12345
      - key: JwtSettings__Issuer
        value: MandiApp.Identity
      - key: JwtSettings__Audience
        value: MandiApp.Mobile

  # Marketplace API
  - type: web
    name: mandiapp-marketplace-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: Backend
    dockerfilePath: Dockerfile.marketplace
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__MarketplaceDb
        value: Host=db.iytscokxxuxprrivmzvg.supabase.co;Port=5432;Database=postgres;User Id=postgres;Password=PYvWmYoMYiO3RiCJ;Ssl Mode=Require;Trust Server Certificate=true
      - key: JwtSettings__SecretKey
        value: YourSuperSecretKeyForJWTAuthentication12345
      - key: JwtSettings__Issuer
        value: MandiApp.Identity
      - key: JwtSettings__Audience
        value: MandiApp.Mobile

  # Ordering API
  - type: web
    name: mandiapp-ordering-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: Backend
    dockerfilePath: Dockerfile.oOrderingDb
        value: Host=db.iytscokxxuxprrivmzvg.supabase.co;Port=5432;Database=postgres;User Id=postgres;Password=PYvWmYoMYiO3RiCJ;Ssl Mode=Require;Trust Server Certificate=true
      - key: JwtSettings__SecretKey
        value: YourSuperSecretKeyForJWTAuthentication12345
      - key: JwtSettings__Issuer
        value: MandiApp.Identity
      - key: JwtSettings__Audience
        value: MandiApp.Mobil
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false

  # Logistics Hub
  - type: web
    name: mandiapp-logistics-hub
    runtime: docker
    region: singapore
    plan: free
    rootDir: Backend
    dockerfilePath: Dockerfile.lLogisticsDb
        value: Host=db.iytscokxxuxprrivmzvg.supabase.co;Port=5432;Database=postgres;User Id=postgres;Password=PYvWmYoMYiO3RiCJ;Ssl Mode=Require;Trust Server Certificate=true
      - key: JwtSettings__SecretKey
        value: YourSuperSecretKeyForJWTAuthentication12345
      - key: JwtSettings__Issuer
        value: MandiApp.Identity
      - key: JwtSettings__Audience
        value: MandiApp.Mobil
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        sync: false

databases:
  - name: mandiapp-db
    databaseName: mandiapp
    user: mandiapp
    plan: free
    region: singapore
