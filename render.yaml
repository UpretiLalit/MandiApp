services:
  # Identity API
  - type: web
    name: mandiapp-identity-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: Backend
    dockerfilePath: Dockerfile.identity
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: ConnectionStrings__DefaultConnection
        value: Host=dpg-d5tlem7gi27c73fagde0-a.singapore-postgres.render.com;Port=5432;Database=mandiapp;Username=mandiapp;Password=EPSiAomLiKxGfKyaHFZ6yWsfWnAjSzPq;Ssl Mode=Require
      - key: JwtSettings__SecretKey
        value: YourSuperSecretKeyForJWTAuthentication12345
      - key: JwtSettings__Issuer
        value: MandiApp.Identity
      - key: JwtSettings__Audience
        value: MandiApp.Mobile

